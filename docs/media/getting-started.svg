<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">UE5 LAN demo four-step quickstart</title>
  <desc id="desc">Download source, open the project, run a desktop host, and connect a controller.</desc>
  <rect width="1200" height="430" rx="28" fill="#071827"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="31" font-weight="750">First result in four steps</text>
  <text x="54" y="94" fill="#bae6fd" font-family="Segoe UI,Arial" font-size="17">No original assets · no paid plugin · source only</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(54 135)"><rect width="244" height="230" rx="22" fill="#0f766e"/><circle cx="38" cy="38" r="20" fill="#ccfbf1"/><text x="38" y="45" text-anchor="middle" fill="#115e59" font-size="21" font-weight="800">1</text><text x="24" y="96" fill="#fff" font-size="24" font-weight="750">Download</text><text x="24" y="132" fill="#d5fffa" font-size="17">Use the Demo ZIP</text><text x="24" y="162" fill="#d5fffa" font-size="17">or clone the repo</text><path d="M105 188v25m-13-12 13 13 13-13M85 220h40" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(336 135)"><rect width="244" height="230" rx="22" fill="#2563eb"/><circle cx="38" cy="38" r="20" fill="#dbeafe"/><text x="38" y="45" text-anchor="middle" fill="#1d4ed8" font-size="21" font-weight="800">2</text><text x="24" y="96" fill="#fff" font-size="24" font-weight="750">Open</text><text x="24" y="132" fill="#eaf2ff" font-size="17">UE 5.4</text><text x="24" y="162" fill="#eaf2ff" font-size="17">UE5LanControlDemo</text><rect x="86" y="187" width="72" height="36" rx="8" fill="none" stroke="#fff" stroke-width="4"/><path d="m105 205 13 9 20-21" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(618 135)"><rect width="244" height="230" rx="22" fill="#7c3aed"/><circle cx="38" cy="38" r="20" fill="#ede9fe"/><text x="38" y="45" text-anchor="middle" fill="#6d28d9" font-size="21" font-weight="800">3</text><text x="24" y="96" fill="#fff" font-size="24" font-weight="750">Run host</text><text x="24" y="132" fill="#f3e8ff" font-size="17">Desktop listens</text><text x="24" y="162" fill="#f3e8ff" font-size="17">on TCP 7777</text><rect x="82" y="188" width="80" height="36" rx="6" fill="none" stroke="#fff" stroke-width="4"/><circle cx="96" cy="206" r="4" fill="#fff"/><path d="M111 206h37" stroke="#fff" stroke-width="4"/></g>
    <g transform="translate(900 135)"><rect width="244" height="230" rx="22" fill="#b45309"/><circle cx="38" cy="38" r="20" fill="#fef3c7"/><text x="38" y="45" text-anchor="middle" fill="#92400e" font-size="21" font-weight="800">4</text><text x="24" y="96" fill="#fff" font-size="24" font-weight="750">Connect</text><text x="24" y="132" fill="#fff7dd" font-size="17">Second desktop</text><text x="24" y="162" fill="#fff7dd" font-size="17">or Android phone</text><path d="M87 194h70M87 216h70" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="m145 184 15 10-15 10M99 206l-15 10 15 10" fill="none" stroke="#fff" stroke-width="4"/></g>
  </g>
  <g stroke="#7dd3fc" stroke-width="5" fill="#7dd3fc"><path d="M302 250h26"/><path d="m328 250-10-7v14z"/><path d="M584 250h26"/><path d="m610 250-10-7v14z"/><path d="M866 250h26"/><path d="m892 250-10-7v14z"/></g>
