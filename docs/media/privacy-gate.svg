<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Public release privacy gate</title>
  <desc id="desc">Four privacy checks must pass before the repository can become public.</desc>
  <rect width="1200" height="500" rx="28" fill="#f8fafc"/>
  <text x="54" y="62" fill="#0f172a" font-family="Segoe UI,Arial" font-size="31" font-weight="750">Public release gate</text>
  <text x="54" y="94" fill="#64748b" font-family="Segoe UI,Arial" font-size="17">Public means every reachable commit and downloadable archive—not only the latest README.</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(54 145)"><rect width="250" height="245" rx="22" fill="#0f766e"/><text x="24" y="48" fill="#ccfbf1" font-size="15" font-weight="700">01 · CURRENT TREE</text><text x="24" y="88" fill="#fff" font-size="23" font-weight="750">Files</text><text x="24" y="128" fill="#d5fffa" font-size="16">contacts · paths</text><text x="24" y="157" fill="#d5fffa" font-size="16">tokens · private IPs</text><circle cx="125" cy="205" r="22" fill="#dcfce7"/><path d="m114 205 8 8 16-19" stroke="#047857" stroke-width="6" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(334 145)"><rect width="250" height="245" rx="22" fill="#2563eb"/><text x="24" y="48" fill="#dbeafe" font-size="15" font-weight="700">02 · GIT HISTORY</text><text x="24" y="88" fill="#fff" font-size="23" font-weight="750">Commits</text><text x="24" y="128" fill="#eaf2ff" font-size="16">author email</text><text x="24" y="157" fill="#eaf2ff" font-size="16">deleted secrets</text><circle cx="125" cy="205" r="22" fill="#dbeafe"/><path d="m114 205 8 8 16-19" stroke="#1d4ed8" stroke-width="6" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(614 145)"><rect width="250" height="245" rx="22" fill="#7c3aed"/><text x="24" y="48" fill="#ede9fe" font-size="15" font-weight="700">03 · RELEASE FILES</text><text x="24" y="88" fill="#fff" font-size="23" font-weight="750">Archives</text><text x="24" y="128" fill="#f3e8ff" font-size="16">ZIP contents</text><text x="24" y="157" fill="#f3e8ff" font-size="16">binary exclusions</text><circle cx="125" cy="205" r="22" fill="#ede9fe"/><path d="m114 205 8 8 16-19" stroke="#6d28d9" stroke-width="6" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(894 145)"><rect width="250" height="245" rx="22" fill="#b45309"/><text x="24" y="48" fill="#fef3c7" font-size="15" font-weight="700">04 · HUMAN REVIEW</text><text x="24" y="88" fill="#fff" font-size="23" font-weight="750">Context</text><text x="24" y="128" fill="#fff7dd" font-size="16">screenshots · names</text><text x="24" y="157" fill="#fff7dd" font-size="16">licenses · claims</text><circle cx="125" cy="205" r="22" fill="#fef3c7"/><path d="m114 205 8 8 16-19" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/></g>
  </g>
  <rect x="54" y="422" width="1090" height="44" rx="12" fill="#fee2e2"/><text x="599" y="451" text-anchor="middle" fill="#991b1b" font-family="Segoe UI,Arial" font-size="17" font-weight="750">Any finding = remain private, remove the cause, rebuild archives, and run every check again.</text>
</svg>
