<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">UE Android packaging path</title><desc id="desc">A five-stage beginner path from a copied project to a real phone and two-device network test.</desc>
  <rect width="1200" height="470" rx="24" fill="#0f172a"/>
  <text x="60" y="66" fill="#fff" font-family="Segoe UI,Arial" font-size="31" font-weight="750">Android packaging: the path that actually matters</text>
  <text x="60" y="99" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="16">Editor success is not the finish line. The packaged phone and packaged desktop must talk.</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <g transform="translate(48 150)"><circle cx="90" cy="62" r="62" fill="#1d4ed8"/><text x="90" y="54" fill="#bfdbfe" font-size="15">01</text><text x="90" y="80" fill="white" font-size="19" font-weight="700">COPY</text><text x="90" y="150" fill="#cbd5e1" font-size="14">match UE version</text></g>
    <g transform="translate(280 150)"><circle cx="90" cy="62" r="62" fill="#7c3aed"/><text x="90" y="54" fill="#ddd6fe" font-size="15">02</text><text x="90" y="80" fill="white" font-size="19" font-weight="700">TRIM</text><text x="90" y="150" fill="#cbd5e1" font-size="14">mobile assets only</text></g>
    <g transform="translate(512 150)"><circle cx="90" cy="62" r="62" fill="#0e7490"/><text x="90" y="54" fill="#cffafe" font-size="15">03</text><text x="90" y="80" fill="white" font-size="19" font-weight="700">CONFIG</text><text x="90" y="150" fill="#cbd5e1" font-size="14">ID · SDK · ARM64</text></g>
    <g transform="translate(744 150)"><circle cx="90" cy="62" r="62" fill="#b45309"/><text x="90" y="54" fill="#fef3c7" font-size="15">04</text><text x="90" y="80" fill="white" font-size="19" font-weight="700">PACKAGE</text><text x="90" y="150" fill="#cbd5e1" font-size="14">clean output</text></g>
    <g transform="translate(976 150)"><circle cx="90" cy="62" r="62" fill="#047857"/><text x="90" y="54" fill="#d1fae5" font-size="15">05</text><text x="90" y="80" fill="white" font-size="19" font-weight="700">TEST</text><text x="90" y="150" fill="#cbd5e1" font-size="14">phone ↔ desktop</text></g>
    <g stroke="#38bdf8" stroke-width="6"><path d="M200 212h70"/><path d="M432 212h70"/><path d="M664 212h70"/><path d="M896 212h70"/></g>
  </g>
  <rect x="60" y="365" width="1080" height="62" rx="16" fill="#1e293b"/><text x="600" y="403" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial" font-size="18">Fresh install · wrong IP · firewall · Wi-Fi loss · background/resume · reconnect · long-run heat</text>
</svg>
