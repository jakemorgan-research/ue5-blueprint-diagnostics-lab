<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">UE5 LAN control demo topology</title>
  <desc id="desc">A controller sends validated JSON commands to a desktop host that moves a cube and stops safely on timeout.</desc>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="54" y="62" fill="#0f172a" font-family="Segoe UI,Arial" font-size="31" font-weight="750">What runs where?</text>
  <text x="54" y="94" fill="#64748b" font-family="Segoe UI,Arial" font-size="17">Same-machine test uses 127.0.0.1. Phone testing uses the desktop LAN address entered at runtime.</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(65 145)"><rect width="330" height="290" rx="24" fill="#1d4ed8"/><text x="28" y="48" fill="#bfdbfe" font-size="15" font-weight="700">CONTROLLER</text><text x="28" y="85" fill="#fff" font-size="29" font-weight="750">Android or desktop</text><rect x="28" y="115" width="274" height="57" rx="13" fill="#fff" opacity=".14"/><text x="48" y="150" fill="#fff" font-size="18">Connect · Forward · Stop</text><rect x="28" y="190" width="274" height="70" rx="13" fill="#fff" opacity=".14"/><text x="48" y="222" fill="#dbeafe" font-size="16">Blueprint API</text><text x="48" y="247" fill="#fff" font-size="18" font-weight="700">Send Move / Send Stop</text></g>
    <g transform="translate(805 145)"><rect width="330" height="290" rx="24" fill="#047857"/><text x="28" y="48" fill="#d1fae5" font-size="15" font-weight="700">AUTHORITATIVE HOST</text><text x="28" y="85" fill="#fff" font-size="29" font-weight="750">Windows desktop</text><rect x="28" y="115" width="274" height="57" rx="13" fill="#fff" opacity=".14"/><text x="48" y="150" fill="#fff" font-size="18">Listen · Validate · Apply</text><rect x="28" y="190" width="274" height="70" rx="13" fill="#fff" opacity=".14"/><text x="48" y="222" fill="#d1fae5" font-size="16">Demo result</text><text x="48" y="247" fill="#fff" font-size="18" font-weight="700">Move the engine cube</text></g>
    <rect x="452" y="145" width="296" height="290" rx="24" fill="#0f172a"/>
    <text x="600" y="188" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="700">TCP 7777 · NEWLINE JSON</text>
    <text x="600" y="233" text-anchor="middle" fill="#fff" font-size="21" font-weight="750">move x/y + sequence</text>
    <path d="M485 270h230" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/><path d="m715 270-16-11v22z" fill="#38bdf8"/>
    <text x="600" y="320" text-anchor="middle" fill="#fff" font-size="21" font-weight="750">ack + sequence</text>
    <path d="M715 352H485" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/><path d="m485 352 16-11v22z" fill="#a78bfa"/>
    <text x="600" y="404" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="700">0.5 s without motion data → STOP</text>
  </g>
  <rect x="65" y="468" width="1070" height="52" rx="14" fill="#e0f2fe"/><text x="600" y="501" text-anchor="middle" fill="#075985" font-family="Segoe UI,Arial" font-size="17" font-weight="700">The repository stores no real device address. The user enters the LAN address only while running the demo.</text>
</svg>
