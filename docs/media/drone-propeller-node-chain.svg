<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title"><title id="title">Drone propeller Blueprint node chain</title><rect width="1200" height="320" rx="28" fill="#07151a"/><text x="48" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">Update four propellers without duplicating the graph</text><g font-family="Segoe UI,Arial" font-size="17" text-anchor="middle"><g fill="#12352f" stroke="#34d399"><rect x="48" y="112" width="190" height="86" rx="15"/><rect x="282" y="97" width="220" height="116" rx="15"/><rect x="546" y="112" width="170" height="86" rx="15"/><rect x="760" y="112" width="170" height="86" rx="15"/><rect x="974" y="97" width="178" height="116" rx="15"/></g><text x="143" y="162" fill="#d1fae5">UpdatePropeller</text><text x="392" y="140" fill="#d1fae5">MakeArray</text><text x="392" y="167" fill="#94a3b8">Propeller 01–04</text><text x="392" y="190" fill="#94a3b8">component refs</text><text x="631" y="162" fill="#d1fae5">ForEachLoop</text><text x="845" y="151" fill="#d1fae5">MakeRotator</text><text x="845" y="177" fill="#94a3b8">speed × delta</text><text x="1063" y="140" fill="#d1fae5">AddRelative</text><text x="1063" y="167" fill="#d1fae5">Rotation</text><text x="1063" y="190" fill="#94a3b8">array element</text></g><g stroke="#64748b" stroke-width="4"><path d="M238 155H282"/><path d="M502 155H546"/><path d="M716 155H760"/><path d="M930 155H974"/></g><text x="48" y="268" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="17">The visible spin is presentation; keep flight physics and authoritative telemetry separate.</text></svg>
