<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">UE5 demo compatibility matrix</title>
  <desc id="desc">UE 5.4 Editor, Win64, Android ARM64 and headless startup are verified; newer engines and desktop platforms remain untested.</desc>
  <rect width="1200" height="470" rx="28" fill="#071827"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="31" font-weight="750">Verified is not the same as allowed</text>
  <text x="54" y="94" fill="#bae6fd" font-family="Segoe UI,Arial" font-size="17">Green = built or run · dotted = descriptor allows it, but no result has been claimed</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(54 140)"><rect width="250" height="215" rx="22" fill="#047857"/><text x="25" y="45" fill="#d1fae5" font-size="15" font-weight="700">VERIFIED</text><text x="25" y="83" fill="#fff" font-size="24" font-weight="750">UE 5.4 Editor</text><text x="25" y="122" fill="#d1fae5" font-size="17">Compiled</text><text x="25" y="152" fill="#d1fae5" font-size="17">Headless startup</text><circle cx="125" cy="185" r="17" fill="#dcfce7"/><path d="m116 185 6 6 13-16" stroke="#047857" stroke-width="5" fill="none"/></g>
    <g transform="translate(334 140)"><rect width="250" height="215" rx="22" fill="#0f766e"/><text x="25" y="45" fill="#ccfbf1" font-size="15" font-weight="700">VERIFIED</text><text x="25" y="83" fill="#fff" font-size="24" font-weight="750">Win64</text><text x="25" y="122" fill="#d5fffa" font-size="17">Development game</text><text x="25" y="152" fill="#d5fffa" font-size="17">Linked successfully</text><circle cx="125" cy="185" r="17" fill="#ccfbf1"/><path d="m116 185 6 6 13-16" stroke="#0f766e" stroke-width="5" fill="none"/></g>
    <g transform="translate(614 140)"><rect width="250" height="215" rx="22" fill="#2563eb"/><text x="25" y="45" fill="#dbeafe" font-size="15" font-weight="700">VERIFIED</text><text x="25" y="83" fill="#fff" font-size="24" font-weight="750">Android ARM64</text><text x="25" y="122" fill="#eaf2ff" font-size="17">Development target</text><text x="25" y="152" fill="#eaf2ff" font-size="17">Debug APK assembled</text><circle cx="125" cy="185" r="17" fill="#dbeafe"/><path d="m116 185 6 6 13-16" stroke="#2563eb" stroke-width="5" fill="none"/></g>
    <g transform="translate(894 140)"><rect width="250" height="215" rx="22" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="12 10"/><text x="25" y="45" fill="#c4b5fd" font-size="15" font-weight="700">UNTESTED</text><text x="25" y="83" fill="#fff" font-size="24" font-weight="750">UE 5.5+ / Mac</text><text x="25" y="122" fill="#ddd6fe" font-size="17">Linux runtime</text><text x="25" y="152" fill="#ddd6fe" font-size="17">Store submission</text><text x="125" y="195" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="750">Report evidence</text></g>
  </g>
  <rect x="54" y="390" width="1090" height="46" rx="13" fill="#164e63"/><text x="599" y="420" text-anchor="middle" fill="#cffafe" font-family="Segoe UI,Arial" font-size="17" font-weight="700">A new green cell requires a reproducible build or runtime report—not an assumption.</text>
</svg>
