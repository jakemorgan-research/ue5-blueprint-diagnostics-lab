<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-backed Blueprint node library</title><desc id="desc">Four beginner paths for network, camera, drone and safety nodes.</desc>
  <rect width="1200" height="420" rx="32" fill="#08111f"/><text x="60" y="72" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="36" font-weight="700">From real graphs to reusable patterns</text><text x="60" y="112" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="19">Verified nodes · clear guards · packaged-test boundaries</text>
  <g font-family="Segoe UI,Arial"><rect x="60" y="155" width="250" height="190" rx="22" fill="#10233f" stroke="#38bdf8"/><text x="88" y="205" fill="#7dd3fc" font-size="22" font-weight="700">01  CONNECT</text><text x="88" y="250" fill="#e2e8f0" font-size="18">Address → TCP client</text><text x="88" y="282" fill="#94a3b8" font-size="16">delegate · framing · ID</text>
  <rect x="335" y="155" width="250" height="190" rx="22" fill="#10233f" stroke="#a78bfa"/><text x="363" y="205" fill="#c4b5fd" font-size="22" font-weight="700">02  CONTROL</text><text x="363" y="250" fill="#e2e8f0" font-size="18">Pressed → start</text><text x="363" y="282" fill="#94a3b8" font-size="16">Released → safe stop</text>
  <rect x="610" y="155" width="250" height="190" rx="22" fill="#10233f" stroke="#34d399"/><text x="638" y="205" fill="#6ee7b7" font-size="22" font-weight="700">03  SIMULATE</text><text x="638" y="250" fill="#e2e8f0" font-size="18">Camera · propellers</text><text x="638" y="282" fill="#94a3b8" font-size="16">robot · drone · HUD</text>
  <rect x="885" y="155" width="250" height="190" rx="22" fill="#10233f" stroke="#fb7185"/><text x="913" y="205" fill="#fda4af" font-size="22" font-weight="700">04  PROTECT</text><text x="913" y="250" fill="#e2e8f0" font-size="18">No secret in client</text><text x="913" y="282" fill="#94a3b8" font-size="16">validate · timeout · test</text></g>
</svg>
