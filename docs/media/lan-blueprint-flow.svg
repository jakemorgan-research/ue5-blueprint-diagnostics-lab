<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Android to desktop LAN Blueprint flow</title><desc id="desc">Phone button input becomes a validated TCP command applied by an authoritative desktop Unreal application.</desc>
  <rect width="1200" height="600" rx="24" fill="#f8fafc"/>
  <text x="56" y="62" font-family="Segoe UI,Arial" font-size="30" font-weight="750" fill="#0f172a">One button press, end to end</text>
  <text x="56" y="94" font-family="Segoe UI,Arial" font-size="16" fill="#64748b">Blue wires are execution. Cyan wires are data. The desktop owns the final state.</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(50 145)"><rect width="190" height="115" rx="16" fill="#1d4ed8"/><text x="95" y="43" fill="#bfdbfe" font-size="14" text-anchor="middle">ANDROID UMG</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">OnPressed</text><text x="95" y="98" fill="#dbeafe" font-size="13" text-anchor="middle">Forward button</text></g>
    <g transform="translate(280 145)"><rect width="190" height="115" rx="16" fill="#6d28d9"/><text x="95" y="43" fill="#ddd6fe" font-size="14" text-anchor="middle">FUNCTION</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">MakeCommand</text><text x="95" y="98" fill="#ede9fe" font-size="13" text-anchor="middle">start · speed 0.4</text></g>
    <g transform="translate(510 145)"><rect width="190" height="115" rx="16" fill="#0e7490"/><text x="95" y="43" fill="#cffafe" font-size="14" text-anchor="middle">TCP CLIENT</text><text x="95" y="75" fill="white" font-size="20" font-weight="700" text-anchor="middle">Send + newline</text><text x="95" y="98" fill="#cffafe" font-size="13" text-anchor="middle">stored Connection ID</text></g>
    <g transform="translate(740 145)"><rect width="190" height="115" rx="16" fill="#b45309"/><text x="95" y="43" fill="#fef3c7" font-size="14" text-anchor="middle">DESKTOP GATEWAY</text><text x="95" y="75" fill="white" font-size="20" font-weight="700" text-anchor="middle">Parse + validate</text><text x="95" y="98" fill="#fef3c7" font-size="13" text-anchor="middle">version · range · rate</text></g>
    <g transform="translate(970 145)"><rect width="180" height="115" rx="16" fill="#047857"/><text x="90" y="43" fill="#d1fae5" font-size="14" text-anchor="middle">ROBOT TARGET</text><text x="90" y="75" fill="white" font-size="20" font-weight="700" text-anchor="middle">Start motion</text><text x="90" y="98" fill="#d1fae5" font-size="13" text-anchor="middle">clamped state</text></g>
    <g stroke="#2563eb" stroke-width="6" stroke-linecap="round"><path d="M240 202h40"/><path d="M470 202h40"/><path d="M700 202h40"/><path d="M930 202h40"/></g>
    <g fill="#2563eb"><path d="m280 202-12-8v16z"/><path d="m510 202-12-8v16z"/><path d="m740 202-12-8v16z"/><path d="m970 202-12-8v16z"/></g>
    <g transform="translate(50 352)"><rect width="190" height="105" rx="16" fill="#1d4ed8"/><text x="95" y="43" fill="#bfdbfe" font-size="14" text-anchor="middle">ANDROID UMG</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">OnReleased</text></g>
    <g transform="translate(280 352)"><rect width="190" height="105" rx="16" fill="#6d28d9"/><text x="95" y="43" fill="#ddd6fe" font-size="14" text-anchor="middle">FUNCTION</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">phase = stop</text></g>
    <g transform="translate(510 352)"><rect width="190" height="105" rx="16" fill="#0e7490"/><text x="95" y="43" fill="#cffafe" font-size="14" text-anchor="middle">TCP CLIENT</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">Send stop</text></g>
    <g transform="translate(740 352)"><rect width="190" height="105" rx="16" fill="#b45309"/><text x="95" y="43" fill="#fef3c7" font-size="14" text-anchor="middle">FAIL SAFE</text><text x="95" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">Timeout too</text></g>
    <g transform="translate(970 352)"><rect width="180" height="105" rx="16" fill="#047857"/><text x="90" y="43" fill="#d1fae5" font-size="14" text-anchor="middle">ROBOT TARGET</text><text x="90" y="75" fill="white" font-size="21" font-weight="700" text-anchor="middle">Stop motion</text></g>
    <g stroke="#2563eb" stroke-width="6" stroke-linecap="round"><path d="M240 404h40"/><path d="M470 404h40"/><path d="M700 404h40"/><path d="M930 404h40"/></g>
    <g fill="#2563eb"><path d="m280 404-12-8v16z"/><path d="m510 404-12-8v16z"/><path d="m740 404-12-8v16z"/><path d="m970 404-12-8v16z"/></g>
  </g>
  <rect x="50" y="505" width="1100" height="58" rx="14" fill="#e0f2fe"/><text x="600" y="541" font-family="Segoe UI,Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#075985">Lost Wi-Fi or app backgrounded? The desktop timeout still calls StopAllMotion.</text>
</svg>
