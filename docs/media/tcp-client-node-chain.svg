<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">TCP client Blueprint node chain</title><rect width="1200" height="360" rx="28" fill="#07111f"/><text x="52" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">Android TCP client — verified core, safer guards</text><g font-family="Segoe UI,Arial" font-size="18"><rect x="52" y="112" width="190" height="105" rx="16" fill="#12304b" stroke="#38bdf8"/><text x="76" y="153" fill="#7dd3fc" font-weight="700">Connect event</text><text x="76" y="184" fill="#cbd5e1">validate address</text><path d="M242 165H292" stroke="#64748b" stroke-width="4"/><polygon points="292,165 278,157 278,173" fill="#64748b"/><rect x="292" y="96" width="270" height="137" rx="16" fill="#15325c" stroke="#60a5fa"/><text x="316" y="137" fill="#93c5fd" font-weight="700">connectSocketClientTCP</text><text x="316" y="169" fill="#cbd5e1">IPv4 · configurable port</text><text x="316" y="199" fill="#fbbf24">define message framing</text><path d="M562 165H612" stroke="#64748b" stroke-width="4"/><polygon points="612,165 598,157 598,173" fill="#64748b"/><rect x="612" y="112" width="210" height="105" rx="16" fill="#1c2943" stroke="#a78bfa"/><text x="636" y="153" fill="#c4b5fd" font-weight="700">Store ID</text><text x="636" y="184" fill="#cbd5e1">track connection state</text><path d="M822 165H872" stroke="#64748b" stroke-width="4"/><polygon points="872,165 858,157 858,173" fill="#64748b"/><rect x="872" y="96" width="276" height="137" rx="16" fill="#173b36" stroke="#34d399"/><text x="896" y="137" fill="#6ee7b7" font-weight="700">Bind delegates</text><text x="896" y="169" fill="#cbd5e1">connection · receive</text><text x="896" y="199" fill="#cbd5e1">timeout → stop all</text></g><text x="52" y="303" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="17">Observed client calls do not prove the desktop server path; verify both packaged applications 