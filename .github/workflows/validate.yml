name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py .
      - run: python scripts/check_public_release.py . --history
      - run: python scripts/check_links.py .
      - run: python scripts/package_skill.py --check
      - run: python scripts/package_ue_demo.py --check
